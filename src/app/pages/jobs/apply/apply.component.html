<div class="container-fluid">
   
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body border-bottom">
                    <div class="d-flex align-items-center">
                        <h5 class="mb-0 card-title flex-grow-1">Applied Jobs</h5>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered align-middle nowrap">
                            <thead>
                                <tr>
                                    <th scope="col">No</th>
                                    <th scope="col">Job Title</th>
                                    <th scope="col">Company Name</th>
                                    <th scope="col">Type</th>
                                    <th scope="col">Status</th>
                                   
                                </tr>
                            </thead>
                            <tbody>
                                @for(data of jobs;track $index){
                                <tr>
                                    <th scope="row">{{data.id}}</th>
                                    <td>{{data.offer.titleJob}}</td>
                                    <td>{{data.offer.company}}</td>
                                     
                                    <td><span class="badge" [ngClass]="{'badge-soft-success': data.offer.jobType === 'FULLTIME','badge-soft-danger': data.offer.jobType === 'PARTTIME','badge-soft-info': data.offer.jobType === 'FREELANCE','badge-soft-warning': data.offer.jobType === 'INTERNSHIP'}">{{data.offer.jobType}}</span></td>
                                    
                                    <td><span class="badge" [ngClass]="{ 'bg-success': data.status === 'ACCEPTED', 'bg-info': data.status === 'PENDING', 'bg-danger': data.status === 'FAILED'}">{{data.status}}</span></td>
                                    
                                </tr>}
                            </tbody>
                        </table>
                    </div>
                    <div class="row justify-content-between align-items-center">
                        <div class="col-auto me-auto">
                            <p class="text-muted mb-0">Showing <b>{{applies?.length}}</b> to <b>{{applyjob?.length}}</b> of <b></b> entries</p>
                        </div>
                        <div class="col-auto">
                            <div class="card d-inline-block ms-auto mb-0">
                                <div class="card-body p-2">
                                    <nav aria-label="Page navigation example" class="mb-0">
                                        <ul class="pagination mb-0">
                                            <pagination [totalItems]="applyjob?.length" [itemsPerPage]="8" (pagechanged)="pagechanged($event)"></pagination>
                                        </ul>
                                    </nav>
                                </div>
                            </div>
                        </div>
                        <!--end col-->
                    </div>
                    <!--end row-->
                </div>
            </div>
        </div>
    </div>
</div>
